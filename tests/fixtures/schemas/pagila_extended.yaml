# pagila_extended -- extended pagila fixture for intelligence-layer corner-case tests
#
# Based on stock pagila (see pagila.yaml, which remains the canonical reference fixture).
# Do NOT use this fixture for benchmarks or L1/L2/L3 runs -- it is intended ONLY
# for unit and integration tests that require signal stock pagila cannot provide:
#
#   A1 embedding-aware clustering:
#     'account' shares semantic meaning with 'customer' but has zero lexical name
#     overlap; 'customer_log' has weak lexical overlap.
#   A3 role classification:
#     'film_snapshot' and 'payment_audit' are unambiguous snapshot/audit candidates
#     that heuristics can classify without embeddings.
#   A4 within-DB near-duplicate detection:
#     'customer_archive' mirrors customer's schema with an extra 'archived_at' column.
#   Deep FK chains (depth 4):
#     film -> inventory -> rental -> payment -> payment_audit
#   Multi-schema / cross-schema FKs:
#     'reporting' schema with cross-schema FK edges back into 'public'.
#
# Consumers: tests/intelligence/ tests that explicitly opt in via load_schema("pagila_extended").
