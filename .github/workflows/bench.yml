name: Bench

on:
  # No paths-ignore: the bench lane runs on every PR (including doc-only)
  # so the dry-run AC is satisfiable and the lane never silently no-ops.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      l3_model:
        description: "L3 model id (defaults to claude-haiku-4-5)"
        required: false
        type: string
        default: "claude-haiku-4-5"
  # L3 runs weekly (Monday 04:00 UTC) for trend watching, on release-tag
  # pushes for the release-being-announced snapshot, and on manual dispatch
  # for ad-hoc runs.
  schedule:
    - cron: '0 4 * * 1'
  push:
    tags: ['v*.*.*']

concurrency:
  group: bench-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-bench:
    name: ${{ matrix.level }} (${{ matrix.dataset }}, ${{ matrix.extras_label }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        level: [l1, l2]
        dataset: [pagila, adventureworks, tpch]
        extras: [dev, dev-embeddings]
        include:
          - extras: dev
            extras_args: "--extra dev"
            extras_label: "dev"
          - extras: dev-embeddings
            extras_args: "--extra dev --extra embeddings"
            extras_label: "dev,embeddings"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked ${{ matrix.extras_args }}
      - name: Cache HuggingFace embedding model
        if: matrix.extras == 'dev-embeddings'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-arctic-embed-xs-${{ hashFiles('src/pretensor/intelligence/embeddings.py') }}
      - name: Pre-warm embedding model (retry on Hub rate limits)
        if: matrix.extras == 'dev-embeddings'
        env:
          # Optional repo secret; anonymous Hub downloads from shared
          # runner IPs are frequently 429-rate-limited. huggingface_hub
          # picks the token up from the environment automatically; an
          # empty value is a no-op.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python -c "from pretensor.intelligence.embeddings import get_default_embedding_client; get_default_embedding_client().embed(['warm'])"; then
              echo "model ready (attempt $attempt)"
              exit 0
            fi
            sleep $((30 + attempt * 15 + RANDOM % 30))
          done
          echo "::error::embedding model download kept failing (HF Hub rate limit?). Add an HF_TOKEN repo secret or retry the run."
          exit 1
      - name: Run benchmark
        # The embeddings lane passes --embeddings and compares against
        # lane-specific baselines: L2 measures real cosine retrieval for
        # semantic_search + the hybrid rerank; L1 measures blind join
        # discovery with the embedding relationship scorer registered at
        # its documented typical threshold (see L1_EMBEDDING_JOIN_THRESHOLD).
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          BENCH_FLAG=""
          SUFFIX=""
          if [ "${{ matrix.extras }}" = "dev-embeddings" ]; then
            BENCH_FLAG="--embeddings"
            SUFFIX="-embeddings"
          fi
          echo "BASELINE_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          uv run pretensor benchmark ${{ matrix.level }} --dataset ${{ matrix.dataset }} $BENCH_FLAG --out current.json
      - name: Compare against baseline
        run: |
          uv run pretensor benchmark compare \
            --baseline tests/benchmark/baselines/${{ matrix.dataset }}-${{ matrix.level }}${BASELINE_SUFFIX}.json \
            --current current.json
      - name: Upload current result on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.level }}-${{ matrix.dataset }}-${{ matrix.extras }}-current
          path: current.json
          retention-days: 14
          if-no-files-found: warn

  l3:
    name: L3 (${{ matrix.dataset }}, ${{ matrix.runner }})
    # L3 is dormant until the per-dataset Postgres fixtures and DSN env
    # vars are wired into CI. Set the repo variable
    # `L3_ENV_PROVISIONED=true` once that work lands; until then,
    # scheduled / tag-push / manual triggers no-op cleanly instead of
    # producing six failed jobs that drown out the L1+L2 signal.
    if: vars.L3_ENV_PROVISIONED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dataset: [pagila, adventureworks, tpch]
        runner: [baseline, pretensor]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.BENCH_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra embeddings
      - name: Run L3
        run: |
          model="${{ inputs.l3_model || 'claude-haiku-4-5' }}"
          uv run pretensor benchmark l3 \
            --dataset ${{ matrix.dataset }} \
            --runner ${{ matrix.runner }} \
            --model "$model" \
            --out results.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-${{ matrix.dataset }}-${{ matrix.runner }}-${{ github.run_id }}
          path: results.json
          retention-days: 90
          if-no-files-found: warn
