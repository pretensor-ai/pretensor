name: CI

on:
  push:
    branches: [main, master, 'publish/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Nightly slow lane (real-model embedding smoke + future heavy fixtures).
    # Daily at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run_slow:
        description: 'Run the slow opt-in test lane (real model downloads).'
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check src tests

  lockfile:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Verify uv.lock matches pyproject.toml
        # Fails if the committed lock would be re-resolved — keeps the reviewed
        # pins identical to what every other job installs with `uv sync --locked`.
        run: uv lock --check

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Pyright
        run: uv run pyright

  test:
    name: Test (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Pytest
        env:
          PYTHONPATH: src
        run: uv run pytest tests/

  build-verify:
    name: Build wheel & verify packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Verify wheel ships every tracked subpackage
        # Guard against .gitignore (or any other exclude) silently dropping a
        # package directory from the built wheel. Every `__init__.py` tracked
        # under `src/pretensor/` must land at the matching path inside the wheel.
        run: |
          uv run python <<'PY'
          import glob, subprocess, sys, zipfile

          whls = sorted(glob.glob("dist/pretensor-*-py3-none-any.whl"))
          if len(whls) != 1:
              sys.exit(
                  f"expected exactly one wheel in dist/, found {len(whls)}: {whls}"
              )
          whl = whls[0]

          with zipfile.ZipFile(whl) as z:
              names = set(z.namelist())

          tracked = subprocess.check_output(
              ["git", "ls-files", "src/pretensor/"], text=True
          ).splitlines()
          expected = sorted(
              f.removeprefix("src/") for f in tracked if f.endswith("/__init__.py")
          )

          missing = [e for e in expected if e not in names]
          if missing:
              print(f"MISSING from {whl}:", file=sys.stderr)
              for m in missing:
                  print(f"  - {m}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {whl} contains all {len(expected)} tracked __init__.py files")
          PY
      - name: Smoke-test the installed wheel
        # Install the freshly built wheel into an isolated env and boot the
        # CLI. `pretensor --help` imports every subcommand module at startup
        # (typer registration), which transitively imports
        # `pretensor.skills.generator` from `cli/commands/index.py`. A missing
        # subpackage would surface here as ModuleNotFoundError — the exact
        # failure mode the published 0.1.0a1 wheel had.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/pretensor-*-py3-none-any.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          uvx --from "${wheels[0]}" pretensor --help > /dev/null

  slow-tests:
    name: Slow tests (opt-in real model)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Install dependencies (with embeddings extra)
        run: uv sync --locked --extra dev --extra embeddings
      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-arctic-embed-xs-${{ hashFiles('src/pretensor/intelligence/embeddings.py') }}
      - name: Pre-warm embedding model (retry on Hub rate limits)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python -c "from pretensor.intelligence.embeddings import get_default_embedding_client; get_default_embedding_client().embed(['warm'])"; then
              echo "model ready (attempt $attempt)"
              exit 0
            fi
            sleep $((30 + attempt * 15 + RANDOM % 30))
          done
          echo "::error::embedding model download kept failing (HF Hub rate limit?). Add an HF_TOKEN repo secret or retry the run."
          exit 1
      - name: Pytest -m slow
        env:
          PYTHONPATH: src
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest -m slow tests/
