name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (L1+L2 vs previous tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so `git describe --tags HEAD^` can resolve the
          # previous tag — the release-gate script needs the full
          # tag history, not just HEAD.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Install pretensor with dev extras
        # The gate runs L1 + L2 with --no-embeddings, so the heavy
        # `embeddings` optional extra (onnxruntime, transformers, …) is
        # not exercised. Skip it to keep the gate job fast. If a future
        # change starts gating the embeddings legs too, add `--extra
        # embeddings` here and pass `--embeddings` below.
        run: uv sync --locked --extra dev
      - name: Run release gate
        run: uv run python -m pretensor.benchmark.release_gate
      - name: Upload candidate-tag results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-results
          path: tests/benchmark/results/${{ github.ref_name }}/
          if-no-files-found: warn
          retention-days: 90

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$pkg" ] || { echo "tag $tag != pyproject $pkg"; exit 1; }
      - name: Build sdist + wheel
        run: uv build
      - name: Validate distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  detect:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test-pypi:
    name: Publish to TestPyPI (prereleases only)
    needs: [build, detect, release-gate]
    if: needs.detect.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi-release
      url: https://test.pypi.org/project/pretensor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: [build, detect, test-pypi, release-gate]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.release-gate.result == 'success' &&
      (needs.test-pypi.result == 'success' || needs.test-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/project/pretensor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  archive-results:
    # Opens a PR with the candidate-tag's release-gate JSON so the next
    # tag cut has a baseline to compare against. Goes through PR review
    # rather than pushing directly to main — main is the public OSS
    # branch and integration there is PR-only by repo policy.
    name: Archive release-gate baselines (open PR)
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-results
          path: tests/benchmark/results/${{ github.ref_name }}/
      - name: Open baseline-archive PR
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet --exit-code tests/benchmark/results/; then
            echo "No release-gate JSON to archive."
            exit 0
          fi
          branch="auto/release-baselines/${TAG}"
          git config user.name  "pretensor-vps-agent[bot]"
          git config user.email "277292434+pretensor-vps-agent[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "tests/benchmark/results/${TAG}/"
          git commit -m "ci(release): archive release-gate baselines for ${TAG}"
          git push -u origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "ci(release): archive release-gate baselines for ${TAG}" \
            --body "Auto-generated by the release workflow after a successful publish of ${TAG}. Carries the L1 + L2 result JSON the next tag cut will compare against; data only, no code change."
 github-release:
    name: Create GitHub Release
    needs: [pypi, detect]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
        run: |
          flags=(--generate-notes --verify-tag --title "${TAG}")
          [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
          gh release create "${TAG}" "${flags[@]}"
