name: open-publish-pr

# Opens a review PR whenever a publish/<tag> release branch is pushed, using
# the built-in GITHUB_TOKEN. A GITHUB_TOKEN-opened PR does not trigger
# pull_request workflows, but that is fine: ci.yml already runs on push for
# publish/**, so required checks attach to the pushed commit SHA and satisfy
# branch protection.

on:
  push:
    branches:
      - "publish/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${BRANCH#publish/}"
          if gh pr view "$BRANCH" --repo "$REPO" --json number >/dev/null 2>&1; then
            echo "PR already open for ${BRANCH}."
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "Release ${version}" \
              --body "Release snapshot for ${version}. Review the diff and confirm CI is green, then merge."
          fi
