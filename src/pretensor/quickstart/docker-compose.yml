services:
  pretensor-quickstart-db:
    image: postgres:16-alpine
    container_name: pretensor-quickstart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    ports:
      # Bind to loopback only. The default postgres:postgres credentials
      # are fine for a local sandbox but must never be reachable from the
      # network: Docker publishes ports past host firewalls, and an exposed
      # default-credential Postgres gets brute-forced within hours.
      - "127.0.0.1:55432:5432"
    volumes:
      - ./pagila_ddl.sql:/docker-entrypoint-initdb.d/01_pagila_ddl.sql:ro
      - ./pagila_data.sql:/docker-entrypoint-initdb.d/02_pagila_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagila"]
      interval: 2s
      timeout: 3s
      retries: 30
