# Public repo pre-commit config — ruff + pyright + internal-ref guard.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        entry: python
        pass_filenames: false
        args: [-m, pyright, --project, .]

      - id: no-internal-refs
        name: no internal tracker references
        language: system
        entry: python scripts/check_no_internal_refs.py
        pass_filenames: true
        stages: [pre-commit]

      - id: no-internal-refs-commit-msg
        name: no internal tracker references (commit message)
        language: system
        entry: python scripts/check_no_internal_refs.py
        pass_filenames: true
        stages: [commit-msg]
